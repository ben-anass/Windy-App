<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard | JavaScript Master Course 2026</title>
  <meta name="description" content="Modern JavaScript Weather Dashboard using Fetch API and Async/Await." />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="cloudy">

  <!-- =========================================
       HEADER
  ========================================== -->
  <header>
    <div class="container">
      <nav class="navbar">
        <div class="logo">
          <div class="logo-icon">☀️</div>
          <div>
            <h1>Weather Dashboard</h1>
            <p>Live Weather • OpenWeather API</p>
          </div>
        </div>
      </nav>

      <!-- ===========================
           SEARCH SECTION
      ============================ -->
      <section class="search-section">
        <form id="searchForm" class="search-form">
          <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-5.2-5.2m1.2-4.8a6 6 0 11-12 0 6 6 0 0112 0z" />
            </svg>
            <input id="cityInput" type="text" placeholder="Search a city..." autocomplete="off" />
          </div>
          <button id="searchButton" type="submit" class="search-btn">
            Search
          </button>
        </form>
      </section>

      <!-- Search History -->
      <div id="searchHistory" class="search-history"></div>
    </div>
  </header>

  <!-- =========================================
       MAIN CONTENT
  ========================================== -->
  <main>
    <div class="container">
      <!-- Weather UI is rendered here dynamically -->
      <div id="weatherContainer"></div>
    </div>
  </main>

  <!-- =========================================
       TOAST NOTIFICATIONS
  ========================================== -->
  <div id="toastContainer"></div>

  <!-- =========================================
       JAVASCRIPT SCRIPT
  ========================================== -->
  <script type="module" src="./js/app.js"></script>
  <p>Anass Ben Abou </p>
</body>
</html>
